spring:
  application:
    name: quack-api
  # No datasource here. Locally, spring-boot-docker-compose supplies it from compose.yaml.
  # Deployed, it comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD env variables.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
  security:
    oauth2:
      client:
        registration:
          google:
            # Real values live in the environment, never in the repo.
            # Register {API origin}/api/v1/auth/callback as an authorized redirect URI.
            client-id: ${GOOGLE_CLIENT_ID:local-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-client-secret}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/api/v1/auth/callback"

quack:
  auth:
    # Server-side allowlist. Adding a campus is a configuration change.
    allowed-email-domains:
      - stevens.edu
    # Expo Go returns through exp://, which a production build should turn off.
    allow-expo-go-redirects: ${QUACK_AUTH_ALLOW_EXPO_GO_REDIRECTS:true}
  # Events must be pinned inside this box (degrees, edges included). It covers the Stevens
  # campus in Hoboken and its dorms; widen it here, not in code.
  campus:
    west: -74.0310
    south: 40.7385
    east: -74.0200
    north: 40.7490

server:
  port: ${PORT:8080}
  # Render terminates TLS and forwards the original scheme so the OAuth redirect URI is https.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 14d
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
